<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alterar Senha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-senha">
  <aside class="barra-lateral">
    <svg class="avatar" viewBox="0 0 100 100" fill="none" stroke="#000" stroke-width="5" aria-hidden="true">
      <circle cx="50" cy="50" r="46"/>
      <circle cx="50" cy="38" r="15"/>
      <path d="M20 82c4-16 16-24 30-24s26 8 30 24"/>
    </svg>
    <hr>
    <a href="index.html" class="btn-escuro">Voltar</a>
  </aside>

  <main class="conteudo">
    <form class="form-senha" id="form-senha" novalidate>
      <h1>Alterar Senha</h1>

      <label for="senha-atual">Senha Atual</label>
      <input type="password" id="senha-atual" autocomplete="current-password">

      <label for="nova-senha">Nova Senha</label>
      <input type="password" id="nova-senha" autocomplete="new-password">

      <label for="confirmar-senha">Confirmar Nova Senha</label>
      <input type="password" id="confirmar-senha" autocomplete="new-password">

      <p class="erro" id="erro-senha" role="alert"></p>
      <button type="submit" class="btn-escuro">Salvar</button>
      <p class="ok" id="ok-senha"></p>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
