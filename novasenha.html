<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar Senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-recuperar">
  <h1>Recuperar Senha</h1>

  <section class="cartao-recuperar cartao-codigo">
    <a class="voltar" href="recuperar-senha.html" aria-label="Voltar">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 12H4M10 6l-6 6 6 6"/>
      </svg>
    </a>

    <h2>Inserir código</h2>

    <form class="form-codigo" action="#" method="post">
      <div class="campos-codigo">
        <input type="text" name="codigo" maxlength="1" inputmode="numeric" pattern="[0-9]" required aria-label="Dígito 1" autocomplete="one-time-code">
        <input type="text" name="codigo" maxlength="1" inputmode="numeric" pattern="[0-9]" required aria-label="Dígito 2">
        <input type="text" name="codigo" maxlength="1" inputmode="numeric" pattern="[0-9]" required aria-label="Dígito 3">
        <input type="text" name="codigo" maxlength="1" inputmode="numeric" pattern="[0-9]" required aria-label="Dígito 4">
      </div>

      <p class="erro"></p>
      <button type="submit" class="btn-escuro">Confirmar</button>
    </form>
  </section>
  <script>
  const campos = document.querySelectorAll('.campos-codigo input');
  campos.forEach((campo, i) => {
    campo.addEventListener('input', () => {
      campo.value = campo.value.replace(/\D/g, '');
      if (campo.value && campos[i + 1]) campos[i + 1].focus();
    });
    campo.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !campo.value && campos[i - 1]) campos[i - 1].focus();
    });
  });
</script>
</body>
</html>
